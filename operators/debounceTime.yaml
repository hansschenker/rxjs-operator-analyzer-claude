      - { frame: 3, kind: timer, input: timer(t1), rule: T1, state: "(b, 3, t2@5)", outputs: [], data: { phase: active, lastValue: b, lastTime: 3, task: { id: t2, dueAt: 5 } } }
      - { frame: 5, kind: timer, input: timer(t2), rule: T2, state: "(∅, 3, ∅)", outputs: [ { kind: emit, label: b } ], data: { phase: active, lastValue: null, lastTime: 3, task: null } }
      - { frame: 7, kind: complete, input: complete, rule: C2, state: "(∅, 3, ∅) completed", outputs: [ { kind: complete } ], data: { phase: completed, lastTime: 3 } }
      - { frame: 7, kind: finalize, input: finalize, rule: F1, state: ⊥ finalized, outputs: [], data: { phase: finalized } }
