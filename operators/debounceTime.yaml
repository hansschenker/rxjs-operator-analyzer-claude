    trace:
      - { frame: 0, kind: subscribe, input: subscribe, rule: S0, state: "(∅, ∅, ∅)", outputs: [], data: { phase: active, lastValue: null, lastTime: null, task: null } }
      - { frame: 1, kind: value, input: value(a), rule: V1, state: "(a, 1, t1@4)", outputs: [], data: { phase: active, lastValue: a, lastTime: 1, task: { id: t1, dueAt: 4 } } }
