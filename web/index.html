<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RxJS Operator Analyzer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <h1>RxJS Operator Analyzer</h1>
        <p>Mealy 6-tuple · State Transition Table · 4-lane timeline</p>
      </div>
      <div class="controls">
        <label>Operator <select id="operator"></select></label>
        <label>Scenario <select id="scenario"></select></label>
        <label>Frame width <input id="frame-width" type="range" min="0" max="110" step="5" value="0" /> <span id="frame-width-label">auto</span></label>
      </div>
      <div class="legend-slot" id="legend"></div>
    </header>
    <main>
      <section class="timeline" id="timeline"></section>
      <h2>Execution trace — step by step</h2>
      <section id="steps"></section>
      <h2>Rules fired in this scenario — T(s, z) and G(s, z)</h2>
      <section id="rules"></section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
